# inventory/hosts.ini
# ─────────────────────────────────────────────────────────────────────────────
# Replace IPs/hostnames with your actual targets.
# Group structure mirrors a typical enterprise VM estate.

[production]
192.168.1.10  ansible_user=admin
192.168.1.11  ansible_user=admin
192.168.1.12  ansible_user=admin

[monitoring]
10.0.0.5      ansible_user=admin
10.0.0.6      ansible_user=admin

[dmz]
172.16.0.10   ansible_user=admin

# Group of groups — run a playbook against all hosts at once
[all_vms:children]
production
monitoring
dmz

[all_vms:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# ansible.cfg
# ─────────────────────────────────────────────────────────────────────────────
# Project-level Ansible configuration.
# This file is automatically picked up when ansible-playbook is run from
# this directory.

[defaults]
inventory           = inventory/hosts.ini
remote_user         = admin
private_key_file    = ~/.ssh/id_rsa
host_key_checking   = False          # set to True in production with known_hosts
retry_files_enabled = False
stdout_callback     = yaml           # cleaner output format
callbacks_enabled   = timer          # show total run time at the end
forks               = 10             # parallel connections
timeout             = 30

# Log all runs locally
log_path            = ./ansible.log

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root
become_ask_pass     = False

[ssh_connection]
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s
pipelining          = True           # significantly speeds up playbook execution
